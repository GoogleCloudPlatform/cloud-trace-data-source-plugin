name: Build and Test

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so new grafana.com validator findings (Go SDK age, OSV advisories)
  # show up without waiting for the next pull request.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Setup Go environment
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'

      - name: Install dependencies
        # Yarn 1 ignores Yarn 2+'s --immutable; --frozen-lockfile fails if yarn.lock is out of date.
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Build and test frontend
        run: |
          yarn build
          yarn typecheck
          yarn test:ci

      - name: Check for backend
        id: check-for-backend
        run: |
          if [ -f "Magefile.go" ]
          then
            echo "has-backend=true" >> $GITHUB_OUTPUT
          fi

      - name: Test backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: magefile/mage-action@6f50bbb8ea47d56e62dee92392788acbc8192d0b # v3
        with:
          version: v1.15.0
          args: coverage

      - name: Build backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: magefile/mage-action@6f50bbb8ea47d56e62dee92392788acbc8192d0b # v3
        with:
          version: v1.15.0
          args: buildAll

      - name: Get plugin metadata
        id: metadata
        run: |
          sudo apt-get install jq

          export GRAFANA_PLUGIN_ID=$(cat dist/plugin.json | jq -r .id)
          export GRAFANA_PLUGIN_VERSION=$(cat dist/plugin.json | jq -r .info.version)
          export GRAFANA_PLUGIN_TYPE=$(cat dist/plugin.json | jq -r .type)
          export GRAFANA_PLUGIN_ARTIFACT=${GRAFANA_PLUGIN_ID}-${GRAFANA_PLUGIN_VERSION}.zip
          export GRAFANA_PLUGIN_ARTIFACT_CHECKSUM=${GRAFANA_PLUGIN_ARTIFACT}.md5

          echo "plugin-id=${GRAFANA_PLUGIN_ID}" >> $GITHUB_OUTPUT
          echo "plugin-version=${GRAFANA_PLUGIN_VERSION}" >> $GITHUB_OUTPUT
          echo "plugin-type=${GRAFANA_PLUGIN_TYPE}" >> $GITHUB_OUTPUT
          echo "archive=${GRAFANA_PLUGIN_ARTIFACT}" >> $GITHUB_OUTPUT
          echo "archive-checksum=${GRAFANA_PLUGIN_ARTIFACT_CHECKSUM}" >> $GITHUB_OUTPUT

          echo "github-tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: Package plugin
        id: package-plugin
        env:
          PLUGIN_ID: ${{ steps.metadata.outputs.plugin-id }}
          PLUGIN_ARCHIVE: ${{ steps.metadata.outputs.archive }}
          PLUGIN_ARCHIVE_CHECKSUM: ${{ steps.metadata.outputs.archive-checksum }}
        run: |
          mv dist "$PLUGIN_ID"
          zip "$PLUGIN_ARCHIVE" "$PLUGIN_ID" -r
          md5sum "$PLUGIN_ARCHIVE" > "$PLUGIN_ARCHIVE_CHECKSUM"
          echo "checksum=$(cut -d' ' -f1 "./$PLUGIN_ARCHIVE_CHECKSUM")" >> "$GITHUB_OUTPUT"

      - name: Validate plugin
        env:
          PLUGIN_ARCHIVE: ${{ steps.metadata.outputs.archive }}
          # plugin-validator 0.56.0 (release commit). Bump deliberately to pick up new grafana.com checks.
          PLUGIN_VALIDATOR_REF: 198bbf2824a33b554482023abdeb7eb20cf65aa4
          # No LLM API keys in CI; skip the LLM-based analyzers explicitly.
          SKIP_LLM_REVIEW: 'true'
          SKIP_LLM_CODEDIFF: 'true'
        run: |
          GOTOOLCHAIN=auto go install "github.com/grafana/plugin-validator/pkg/cmd/plugincheck2@${PLUGIN_VALIDATOR_REF}"
          # Give plugincheck2 the committed source (no node_modules or build output) so the
          # source-code analyzers that grafana.com runs on submission (Go SDK age, osv-scanner
          # on go.mod and yarn.lock, ...) also run on every PR.
          PLUGIN_SOURCE_DIR="$RUNNER_TEMP/plugin-source"
          mkdir -p "$PLUGIN_SOURCE_DIR"
          git archive HEAD | tar -x -C "$PLUGIN_SOURCE_DIR"
          # Same severities as grafana.com's submission config (config/publishing.yaml in
          # plugin-validator), except the version check: it fails whenever package.json is
          # not ahead of the version already published on grafana.com.
          cat <<'EOF' > plugincheck-ci.yaml
          global:
            enabled: true
            severity: error
            jsonOutput: false
            reportAll: false
          analyzers:
            htmlreadme:
              severity: warning
            legacyplatform:
              severity: warning
            jargon:
              severity: warning
            restrictivedep:
              severity: warning
            screenshots:
              severity: warning
            version:
              rules:
                wrong-plugin-version:
                  enabled: false
          EOF
          plugincheck2 -config ./plugincheck-ci.yaml -sourceCodeUri "file://$PLUGIN_SOURCE_DIR" "$PLUGIN_ARCHIVE"
